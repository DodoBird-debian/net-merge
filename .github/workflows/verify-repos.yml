name: verify-community-installers
# Runs against this fork's published assets. Package-manager/container validation remains in ci.yml.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          NET_MERGE_NO_START: '1'
        run: |
          sh install.sh
          sh install.sh
          net-merge version
          sh install.sh uninstall
          hash -r
          test -z "$(command -v net-merge)"
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          NET_MERGE_NO_START: '1'
        run: |
          sh install.sh
          net-merge version
          sudo test -f /etc/sudoers.d/net-merge
          sh install.sh uninstall
          hash -r
          test -z "$(command -v net-merge)"
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          $env:NET_MERGE_NO_START = '1'
          ./install.ps1
          & "$env:ProgramFiles\net-merge\net-merge.exe" version
          & "$env:ProgramFiles\net-merge\net-merge.exe" quit
          Start-Process "$env:ProgramFiles\net-merge\unins000.exe" '/SILENT' -Verb RunAs -Wait
          for ($i = 0; $i -lt 30 -and (Test-Path "$env:ProgramFiles\net-merge\net-merge.exe"); $i++) { Start-Sleep 1 }
          if (Test-Path "$env:ProgramFiles\net-merge\net-merge.exe") { throw 'net-merge is still installed' }
