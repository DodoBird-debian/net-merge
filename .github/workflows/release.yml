name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: choco install innosetup --no-progress -y
      - name: Test and build Windows
        shell: pwsh
        run: |
          go test -race -timeout 5m ./...
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          scripts/build.ps1 -Version 0.4.0 -RepoUrl "${{ github.server_url }}/${{ github.repository }}"
          go build -o dist/winfakeup.exe ./scripts/winfakeup
          scripts/windows-smoke.ps1 dist/net-merge.exe
      - uses: actions/upload-artifact@v4
        with:
          name: build-windows
          path: |
            dist/net-merge-setup-*.exe
            dist/net-merge-*-portable.zip
          if-no-files-found: error
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test -race -timeout 5m ./...
      - run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
      - run: scripts/build-linux.sh 0.4.0 dist
      - uses: actions/upload-artifact@v4
        with:
          name: build-linux
          path: dist/*
          if-no-files-found: error
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test and build universal binary
        run: |
          sudo ifconfig lo0 alias 127.0.0.2/32
          sudo ifconfig lo0 alias 127.0.0.3/32
          go test -race -timeout 5m ./...
          for arch in arm64 amd64; do
            CGO_ENABLED=1 GOARCH=$arch go build -trimpath -ldflags '-s -w -X main.version=0.4.0' -o net-merge-$arch ./cmd/net-merge
          done
          lipo -create -output net-merge net-merge-arm64 net-merge-amd64
          codesign --force --sign - net-merge
          lipo -verify_arch arm64 x86_64 net-merge
          mkdir dist
          tar -czf dist/net-merge-0.4.0-macos-universal.tar.gz net-merge LICENSE THIRD-PARTY-NOTICES.md
      - uses: actions/upload-artifact@v4
        with:
          name: build-macos
          path: dist/*
          if-no-files-found: error
  phones:
    uses: ./.github/workflows/phone-builds.yml
    secrets: inherit
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux, macos, phones]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: build-*
          path: dist
          merge-multiple: true
      - name: Check release set and create stable download aliases
        run: |
          test '${{ github.ref_name }}' = v0.4.0
          python3 scripts/prepare-release.py dist 0.4.0
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release-notes.py 0.4.0 > release-notes.md
          # Keep partial uploads private. A failed upload leaves a recoverable draft.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --title 'net-merge 0.4.0 · Iraq PC Community' --notes-file release-notes.md
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest --notes-file release-notes.md
