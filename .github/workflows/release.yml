name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        default: '0.4.0'
        type: string
      publish:
        description: Publish after all builds and checks pass
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version || '0.4.0' }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v=${GITHUB_REF_NAME#v}; else v=$REQUESTED_VERSION; fi
          python3 -c 'import re,sys; assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+",sys.argv[1]), "invalid version"' "$v"
          echo "value=$v" >> "$GITHUB_OUTPUT"
  windows:
    needs: version
    env:
      APP_VERSION: ${{ needs.version.outputs.value }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: choco install innosetup --no-progress -y
      - name: Test and build Windows
        shell: pwsh
        run: |
          go test -race -timeout 5m ./...
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          scripts/build.ps1 -Version $env:APP_VERSION -RepoUrl "${{ github.server_url }}/${{ github.repository }}"
          go build -o dist/winfakeup.exe ./scripts/winfakeup
          scripts/windows-smoke.ps1 dist/net-merge.exe
      - uses: actions/upload-artifact@v4
        with:
          name: build-windows
          path: |
            dist/net-merge-setup-*.exe
            dist/net-merge-*-portable.zip
          if-no-files-found: error
  linux:
    needs: version
    env:
      APP_VERSION: ${{ needs.version.outputs.value }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test -race -timeout 5m ./...
      - run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
      - run: scripts/build-linux.sh "$APP_VERSION" dist
      - uses: actions/upload-artifact@v4
        with:
          name: build-linux
          path: dist/*
          if-no-files-found: error
  macos:
    needs: version
    env:
      APP_VERSION: ${{ needs.version.outputs.value }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test and build universal binary
        run: |
          sudo ifconfig lo0 alias 127.0.0.2/32
          sudo ifconfig lo0 alias 127.0.0.3/32
          go test -race -timeout 5m ./...
          for arch in arm64 amd64; do
            CGO_ENABLED=1 GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$APP_VERSION" -o net-merge-$arch ./cmd/net-merge
          done
          lipo -create -output net-merge net-merge-arm64 net-merge-amd64
          codesign --force --sign - net-merge
          lipo net-merge -verify_arch arm64 x86_64
          mkdir dist
          tar -czf "dist/net-merge-$APP_VERSION-macos-universal.tar.gz" net-merge LICENSE THIRD-PARTY-NOTICES.md
      - uses: actions/upload-artifact@v4
        with:
          name: build-macos
          path: dist/*
          if-no-files-found: error
  phones:
    needs: version
    uses: ./.github/workflows/phone-builds.yml
    with:
      version: ${{ needs.version.outputs.value }}
    secrets: inherit
  publish:
    if: startsWith(github.ref, 'refs/tags/') || inputs.publish
    needs: [version, windows, linux, macos, phones]
    env:
      APP_VERSION: ${{ needs.version.outputs.value }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: build-*
          path: dist
          merge-multiple: true
      - name: Require full CI on the release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/wait-release-ci.py
      - name: Check release set and create stable download aliases
        run: |
          python3 scripts/prepare-release.py dist "$APP_VERSION"
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release-notes.py "$APP_VERSION" > release-notes.md
          tag="v$APP_VERSION"
          # Keep partial uploads private. A failed upload leaves a recoverable draft.
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --draft --target "$GITHUB_SHA" --title "net-merge $APP_VERSION · Iraq PC Community" --notes-file release-notes.md
          gh release upload "$tag" dist/* --clobber
          gh release edit "$tag" --draft=false --latest --notes-file release-notes.md
